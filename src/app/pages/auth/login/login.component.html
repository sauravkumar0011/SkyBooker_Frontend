<div class="auth-page">
  <div class="auth-shell no-visual login-shell">
    <div class="auth-card card animate-fade-up login-card-split">
      <div class="login-card-content">
        <h2 class="auth-title">Welcome back ᯓ  ✈︎</h2>
        <br>
       
        <form [formGroup]="form" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" formControlName="email" placeholder="you@example.com" />
            <span class="form-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Enter a valid email</span>
          </div>

          <div class="form-group">
            <label class="form-label">Password</label>
            <div class="input-with-icon">
              <input [type]="showPassword ? 'text' : 'password'" class="form-control" formControlName="password" placeholder="Your password" />
              <button
                type="button"
                class="eye-btn"
                [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
                [attr.aria-pressed]="showPassword"
                (click)="showPassword = !showPassword"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.2 12s3.6-6 9.8-6 9.8 6 9.8 6-3.6 6-9.8 6-9.8-6-9.8-6Z"></path>
                  <circle cx="12" cy="12" r="3.2"></circle>
                  <path *ngIf="showPassword" d="M4 20 20 4"></path>
                </svg>
              </button>
            </div>
            <span class="form-error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">Password is required (min 6 chars)</span>
          </div>

          <div class="auth-inline-row">
            <a routerLink="/forgot-password" class="auth-inline-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-full btn-lg auth-submit-btn" [disabled]="loading">
            <span class="auth-btn-label" *ngIf="!loading">Sign In</span>
            <span class="auth-btn-label" *ngIf="loading">
              <span class="auth-btn-spinner" aria-hidden="true"></span>
              <span>Signing In...</span>
            </span>
          </button>
        </form>

        <div class="login-divider text-muted text-sm" aria-hidden="true">
          or continue with
        </div>

        <button
          type="button"
          class="btn btn-secondary btn-full btn-lg login-google-btn"
          [disabled]="loading || oauthLoading"
          (click)="continueWithGoogle()"
        >
          <svg class="oauth-google-mark" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M21.805 12.23c0-.68-.061-1.334-.174-1.962H12v3.711h5.5a4.704 4.704 0 0 1-2.042 3.087v2.563h3.304c1.934-1.781 3.043-4.406 3.043-7.399Z"/>
            <path fill="#34A853" d="M12 22c2.76 0 5.076-.914 6.761-2.471l-3.304-2.563c-.914.613-2.084.975-3.457.975-2.654 0-4.902-1.792-5.705-4.201H2.88v2.643A10 10 0 0 0 12 22Z"/>
            <path fill="#FBBC05" d="M6.295 13.74A5.996 5.996 0 0 1 5.976 12c0-.603.109-1.188.319-1.74V7.617H2.88A10 10 0 0 0 2 12c0 1.611.386 3.137 1.08 4.383l3.215-2.643Z"/>
            <path fill="#EA4335" d="M12 6.06c1.5 0 2.847.516 3.907 1.53l2.931-2.93C17.072 2.998 14.756 2 12 2A10 10 0 0 0 2.88 7.617l3.415 2.643C7.098 7.851 9.346 6.06 12 6.06Z"/>
          </svg>
          <span class="auth-btn-label" *ngIf="!oauthLoading">Continue with Google</span>
          <span class="auth-btn-label" *ngIf="oauthLoading">Redirecting...</span>
        </button>

        <div class="auth-footer">
          <p class="text-muted text-sm">Don't have an account? <a routerLink="/register" [queryParams]="returnUrl ? { returnUrl } : null" class="text-cyan">Sign up</a></p>
        </div>
      </div>

      <div class="login-card-visual">
        <div class="login-card-visual-media">
          <img src="assets/illustrations/destination-concept-illustration_86047-1314.avif" alt="Destination illustration for upcoming travel plans" />
          <div class="auth-visual-overlay">
            <h3>Pick up your next destination faster.</h3>
          </div>
        </div>

        <div class="auth-visual-highlights">
          <div class="visual-stat">
            <strong>Live trips</strong>
            <span>booking access</span>
          </div>
          <div class="visual-stat">
            <strong>Seat picks</strong>
            <span>resume faster</span>
          </div>
          <div class="visual-stat">
            <strong>Secure</strong>
            <span>Google or email</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
